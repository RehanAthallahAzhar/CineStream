version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinestream_api
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_ENV: "production"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "cinestream_db"
      DB_SSLMODE: "disable"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "5"
      DB_CONN_MAX_LIFETIME_MINUTES: "15"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinestream_network

  postgres:
    image: postgres:16-alpine
    container_name: cinestream_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinestream_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cinestream_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinestream_network

volumes:
  postgres_data:

networks:
  cinestream_network:
    driver: bridge
